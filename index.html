<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mia Cook | Cybersecurity Portfolio</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #102c42, #02070b 65%);
        color: #f7f1df;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      main {
        width: min(700px, 85%);
        padding: 50px 30px;
        border: 1px solid #c89b45;
        background: rgba(3, 12, 18, 0.88);
        box-shadow: 0 0 40px rgba(44, 165, 210, 0.18);
      }

      .status {
        color: #9fe870;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
      }

      h1 {
        margin-bottom: 10px;
        color: #d6ae5b;
        font-size: clamp(2.5rem, 8vw, 5rem);
      }

      h2 {
        color: #f7f1df;
        font-weight: normal;
      }

      p {
        color: #b9c6cc;
        line-height: 1.7;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="status">System Online</div>

      <h1>AGENT MC</h1>

      <h2>Cyber Intelligence Portfolio</h2>

      <p>Every alert is a clue. Every investigation is a mission.</p>

      <p>Full Cipher Division portfolio currently under development.</p>
    </main>
  </body>
</html>
